name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend - TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

  backend-check:
    name: Backend - Syntax & Import Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app/

      - name: Verify main module imports
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          MIGRATIONS_DATABASE_URL: postgresql://user:pass@localhost:5432/db
          APP_DB_PASSWORD: dummy
          JWT_SECRET: dummy-jwt-secret
          SECRET_ENCRYPTION_KEY: dummy-fernet-key
          OBJECT_STORAGE_ACCESS_KEY: dummy
          OBJECT_STORAGE_SECRET_KEY: dummy
          OBJECT_STORAGE_BUCKET: dummy-bucket
        run: |
          python -c "from app.main import app; print('Main module imported successfully')"

      - name: Check for common issues
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path

          errors = []
          for py_file in Path('app').rglob('*.py'):
              try:
                  ast.parse(py_file.read_text())
              except SyntaxError as e:
                  errors.append(f'{py_file}: {e}')

          if errors:
              print('Syntax errors found:')
              for err in errors:
                  print(f'  {err}')
              sys.exit(1)
          print('All Python files have valid syntax')
          "

  backend-tests:
    name: Backend - Integration Tests (RLS + auth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dashboarduz_owner
          POSTGRES_PASSWORD: owner_dev_password
          POSTGRES_DB: dashboarduz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboarduz_owner -d dashboarduz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # app_user password chosen to match tests/conftest.py's default (there is
      # no backend/.env in CI, so conftest falls back to app_user_dev_password /
      # owner_dev_password @ localhost:5432).
      APP_DB_PASSWORD: app_user_dev_password
      DATABASE_URL: postgresql://app_user:app_user_dev_password@localhost:5432/dashboarduz
      MIGRATIONS_DATABASE_URL: postgresql://dashboarduz_owner:owner_dev_password@localhost:5432/dashboarduz
      JWT_SECRET: dummy-jwt-secret-that-is-at-least-32-bytes-long
      SECRET_ENCRYPTION_KEY: dummy-fernet-key
      OBJECT_STORAGE_ACCESS_KEY: dummy
      OBJECT_STORAGE_SECRET_KEY: dummy
      OBJECT_STORAGE_BUCKET: dummy-bucket

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m app.db.migrate

      - name: Run tests
        run: python -m pytest tests/ -v

  security-scan:
    name: Dependency CVE Scan
    runs-on: ubuntu-latest
    # Triaged 2026-07-25: backend requirements are CVE-clean, so pip-audit is
    # BLOCKING (fails CI on any new vuln) to keep it that way. The frontend
    # npm audit stays advisory (continue-on-error) because the one outstanding
    # high is react-router's RSC-mode CSRF advisory (GHSA-qwww-vcr4-c8h2), whose
    # only fix is the react-router 7 -> 8 major upgrade; this SPA doesn't use RSC
    # mode, so it isn't exposed. Do that migration separately, then drop
    # continue-on-error below to make the frontend audit blocking too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python dependency audit (pip-audit, blocking)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend dependency audit (npm audit, advisory)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check, backend-tests, security-scan]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.frontend-check.result }}" != "success" ] || [ "${{ needs.backend-check.result }}" != "success" ] || [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
